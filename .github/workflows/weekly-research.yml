name: Weekly Research

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch: {}    # manual "Run workflow" button for testing

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # so Claude can commit its results
      id-token: write      # the action always requests an OIDC token in agent mode
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Show the full transcript for this diagnostic run (turn off once stable).
          show_full_output: true
          prompt: "Follow the instructions in research-brief.md"
          # Allow Bash broadly: the agent needs git plus helpers (date for the ISO
          # week, mkdir, etc.) and compound commands, which Bash(git:*) blocked.
          claude_args: "--allowedTools WebSearch,WebFetch,Read,Write,Edit,Bash"
