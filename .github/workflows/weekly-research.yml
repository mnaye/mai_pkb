name: Weekly Research

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch: {}    # manual "Run workflow" button for testing

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # so Claude can commit its results
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Follow the instructions in research-brief.md"
          claude_args: "--allowedTools WebSearch,WebFetch,Read,Write,Edit,Bash(git:*)"
